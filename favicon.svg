<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b4b"/>
      <stop offset="1" stop-color="#a40000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="240" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="290" font-weight="900" font-style="italic" letter-spacing="-26" fill="url(#red)" stroke="#ff2a2a" stroke-width="5" paint-order="stroke" filter="url(#glow)">NK</text>
</svg>
